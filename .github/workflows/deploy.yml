name: Deploy

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0). Leave empty to auto-detect from cjpm.toml.'
        required: false
        default: ''
      prerelease:
        description: 'Is this a pre-release?'
        required: true
        type: boolean
        default: false

env:
  APP_NAME: XQuest
  APP_NAME_LOWERCASE: xquest
  CANGJIE_CHANNEL: sts
  CANGJIE_VERSION: 1.1.0

jobs:
  deploy:
    name: ${{ matrix.name }} deploy
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux
            os: ubuntu-latest
            triplet: x64-linux
            suffix: linux-x86_64
          - name: Windows x64
            os: windows-latest
            suffix: windows-x64

    steps:
      - name: Checkout ${{ env.APP_NAME }}
        uses: actions/checkout@v6

      - name: Install Ubuntu dependencies (Linux)
        if: runner.os == 'Linux'
        uses: awalsh128/cache-apt-pkgs-action@latest
        with:
          packages: fuse libx11-dev libxrandr-dev libxcursor-dev libxi-dev libudev-dev libgl1-mesa-dev
          version: 1.0
          execute_install_scripts: true

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        uses: johnwason/vcpkg-action@v7
        id: vcpkg
        with:
          pkgs: sfml
          triplet: ${{ matrix.triplet }}
          extra-args: --overlay-ports=../dependencies/vcpkg
          cache-key: vcpkg-${{ matrix.triplet }}-deploy
          token: ${{ secrets.GITHUB_TOKEN }}
          revision: '84bab45d415d22042bd0b9081aea57f362da3f35'  # 2025.12.12

      - name: Build and install CSFML (Linux)
        if: runner.os == 'Linux'
        run: |
          git clone --branch feature/right-align-text-3 https://github.com/dgcor/CSFML.git dependencies/csfml
          cp -f dependencies/CMakePresets.json dependencies/csfml/CMakePresets.json
          cd dependencies/csfml
          cmake --preset linux-release -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          cmake --build --preset linux-release --target install

      - name: Download CSFML (Windows)
        if: runner.os == 'Windows'
        run: |
          Invoke-WebRequest -Uri "https://github.com/dgcor/CSFML/releases/download/3.0.0.1/CSFML-3.0.0-windows-64-bit.zip" -OutFile "CSFML-3.0.0-windows-64-bit.zip"
          New-Item -ItemType Directory -Path "dependencies\csfml" -Force
          Expand-Archive -Path "CSFML-3.0.0-windows-64-bit.zip" -DestinationPath "dependencies\csfml"
          Move-Item -Path "dependencies\csfml\bin\*.*" -Destination "dependencies\csfml"
          Move-Item -Path "dependencies\csfml\lib\gcc\*.*" -Destination "dependencies\csfml"

      - name: Setup llvm-mingw (Windows)
        if: runner.os == 'Windows'
        run: |
          $env:LLVM_VERSION = "20260311"
          $env:ARCHIVE_NAME = "llvm-mingw-$env:LLVM_VERSION-msvcrt-x86_64"
          Invoke-WebRequest -Uri "https://github.com/mstorsjo/llvm-mingw/releases/download/$env:LLVM_VERSION/$env:ARCHIVE_NAME.zip" -OutFile "llvm-mingw.zip"
          7z x "llvm-mingw.zip" -o"C:\llvm-mingw" -y
          echo "C:\llvm-mingw\$env:ARCHIVE_NAME\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Verify llvm-mingw installation (Windows)
        if: runner.os == 'Windows'
        run: clang --version

      - name: Setup Cangjie
        uses: Zxilly/setup-cangjie@v2
        with:
          channel: ${{ env.CANGJIE_CHANNEL }}
          version: ${{ env.CANGJIE_VERSION }}
          archive-path: ./cangjie-archive

      - name: Build ${{ env.APP_NAME }}
        shell: bash
        run: |
          mv -f cjpm-release.toml cjpm.toml
          cjpm build -o ${{ env.APP_NAME }}

      - name: Install UPX (Windows)
        if: runner.os == 'Windows'
        uses: crazy-max/ghaction-upx@v3
        with:
          install-only: true

      - name: Install LinuxDeploy (Linux)
        if: runner.os == 'Linux'
        run: |
          wget https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage -N
          chmod +x linuxdeploy-x86_64.AppImage

      - name: Create AppImage (Linux)
        if: runner.os == 'Linux'
        run: |
          export LD_LIBRARY_PATH=dependencies/csfml:$LD_LIBRARY_PATH
          ./linuxdeploy-x86_64.AppImage \
            --executable=target/release/bin/${{ env.APP_NAME }} \
            --appdir out/appdir \
            --desktop-file=pkg/linux/${{ env.APP_NAME_LOWERCASE }}.desktop \
            --icon-file=pkg/linux/icon.png \
            --output=appimage

      - name: Prepare ${{ env.APP_NAME }} Files (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p upload-artifact
          mv ${{ env.APP_NAME }}*.AppImage upload-artifact/
          cp LICENSE.* README.* main.json upload-artifact/ || true
          cp -r gamefiles* upload-artifact/ || true

      - name: Prepare ${{ env.APP_NAME }} Files (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir upload-artifact
          mv target/release/bin/${{ env.APP_NAME }}.exe upload-artifact/
          mv dependencies/csfml/*.dll upload-artifact/
          rm upload-artifact/csfml-network-3.dll
          rm upload-artifact/sfml-network-3.dll
          upx -9 upload-artifact/*.dll
          cp LICENSE.* README.* main.json upload-artifact/ || true
          cp -r gamefiles* upload-artifact/ || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.APP_NAME }}-${{ matrix.suffix }}
          path: upload-artifact/

  release:
    name: Create Release
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Get Version
        id: version
        run: |
          INPUT_VER="${{ github.event.inputs.version }}"
          if [ -z "$INPUT_VER" ]; then
            RAW_VER=$(grep -Po '(?m)^\s*version\s*=\s*"\K[^"]+' cjpm.toml)
            if [ -z "$RAW_VER" ]; then
              echo "Error: Could not detect version from cjpm.toml"
              exit 1
            fi
            if [[ "$RAW_VER" != v* ]]; then
              RAW_VER="v$RAW_VER"
            fi
            echo "VERSION=$RAW_VER" >> $GITHUB_OUTPUT
            echo "Detected version: $RAW_VER"
          else
            echo "VERSION=$INPUT_VER" >> $GITHUB_OUTPUT
            echo "Using input version: $INPUT_VER"
          fi
        shell: bash

      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts

      - name: Prepare Release Assets
        id: assets
        env:
          APP_NAME: ${{ env.APP_NAME }}
          VERSION: ${{ steps.version.outputs.VERSION }}
        run: |
          CLEAN_VERSION="${VERSION#v}"
          for dir in artifacts/*/; do
            [ -d "$dir" ] || continue
            FOLDER_NAME=$(basename "$dir")
            SUFFIX="${FOLDER_NAME#$APP_NAME-}"
            ZIP_NAME="${APP_NAME}-${SUFFIX}-${CLEAN_VERSION}.zip"
            (cd "$dir" && zip -r "$OLDPWD/$ZIP_NAME" .)
            echo "Prepared: $ZIP_NAME"
          done
          echo "Generated files:"
          ls -l *.zip

      - name: Create Release
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.VERSION }}
          name: ${{ env.APP_NAME }} ${{ steps.version.outputs.VERSION }}
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          generate_release_notes: true
          files: |
            *.zip
