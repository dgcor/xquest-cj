[package]
  cjc-version = "1.1.0"
  name = "xquest"
  description = "XQuest game"
  version = "0.1.1"
  target-dir = ""
  src-dir = ""
  output-type = "executable"
  compile-option = "--disable-reflection --static -O2"
  override-compile-option = "--disable-reflection -O2"
  link-option = "-s"
  package-configuration = {}

[dependencies]
  cjsfml = { path = "dependencies/cjsfml", output-type = "static" }
  customiterators = { path = "dependencies/customiterators", output-type = "static" }
  dgengine = { path = "dependencies/dgengine", output-type = "static" }
  endian = { path = "dependencies/endian", output-type = "static" }
  stdjson2 = { path = "dependencies/stdjson2", output-type = "static" }
  stdlog = { path = "dependencies/stdlog", output-type = "static" }

[replace]
  endian = { path = "dependencies/endian", output-type = "static" }
  physfs4cj = { path = "dependencies/physfs4cj", output-type = "static" }
  stdjson2 = { path = "dependencies/stdjson2", output-type = "static" }
  stdlog = { path = "dependencies/stdlog", output-type = "static" }

[target.x86_64-w64-mingw32]
  link-option = "--subsystem windows"
